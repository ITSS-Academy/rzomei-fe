<mat-expansion-panel class="cv-section-panel">
  <mat-expansion-panel-header class="section-header">
    <mat-panel-title class="panel-title">
      <div class="title-content">
        <mat-icon class="section-icon">folder</mat-icon>
        <span class="section-name">Dự án</span>
      </div>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <!-- Panel Content -->
  <div class="panel-content">
    <div class="experience-forms-container">
      <!-- Project Forms List -->
      <div class="forms-list">
        <app-project-form-edit
          *ngFor="let project of projectForms; let i = index"
          [projectData]="project"
          [isReadOnly]="false"
          [forceCollapse]="
            currentEditingIndex !== null && currentEditingIndex !== i
          "
          (formChange)="updateForm(i, $event)"
          (deleteForm)="deleteForm(i)"
          (requestEdit)="onFormExpanded(i)"
          (editToggle)="$event ? onFormExpanded(i) : onFormCollapsed(i)"
          class="form-item"
        ></app-project-form-edit>
      </div>
      <div class="button-edit">
        <button
          mat-flat-button
          color="primary"
          (click)="addForm()"
          class="add-form-btn"
          matTooltip="Thêm dự án mới"
        >
          <mat-icon>add</mat-icon>
          Thêm dự án
        </button>
      </div>
    </div>
  </div>
</mat-expansion-panel>

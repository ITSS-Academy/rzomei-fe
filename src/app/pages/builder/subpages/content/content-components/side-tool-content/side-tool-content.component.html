<mat-card class="side-tool-container" [class.collapsed]="isCollapsed">
  <div class="title-row">
    <div class="title">
      <!-- <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>shopping_bag</mat-icon>
      </button> -->
    </div>
  </div>
  <br />
  
  <!-- Export Section -->
  <!-- @if (!isCollapsed) {
    <div class="export-section">
      <h4>Xuất dữ liệu</h4>
      <div class="export-actions">
        <button mat-raised-button color="primary" (click)="exportCVJson()">
          <mat-icon>download</mat-icon>
          Tải xuống JSON
        </button>
        <button mat-stroked-button color="accent" (click)="previewCVData()">
          <mat-icon>preview</mat-icon>
          Xem dữ liệu
        </button>
      </div>
    </div>
    <mat-divider></mat-divider>
    <br />
  } -->

  @if (sectionTemplates.length > 0) { 
    @for (block of sectionTemplates; track $index) {
      <div class="tool-block">
        <mat-card class="tool-card" appearance="outlined">
          <div class="tool-content">
            <button mat-mini-fab disabled>
              <mat-icon>{{ block.icon }}</mat-icon>
            </button>
            @if (!isCollapsed) {
              <div class="tool-info">
                <div class="tool-title">{{ block.title }}</div>
                <div class="tool-desc">{{ block.description }}</div>
              </div>
              <button mat-icon-button (click)="addBlock(block)">
                <mat-icon>add</mat-icon>
              </button>
            }
          </div>
        </mat-card>
      </div>
    }
  } @else { 
    @if (!isCollapsed) {
      <div class="empty-blocks">Tất cả khối đã được thêm</div>
    } 
  }
</mat-card>

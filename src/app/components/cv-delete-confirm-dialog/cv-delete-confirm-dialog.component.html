<div class="dialog-container">
  <div class="dialog-header">
    <mat-icon class="warning-icon" color="warn">warning</mat-icon>
    <h2 mat-dialog-title>Xác nhận xóa</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p>Bạn có chắc chắn muốn xóa nội dung này?</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-btn">Hủy</button>
    <button
      mat-raised-button
      color="warn"
      (click)="onConfirm()"
      class="confirm-btn"
    >
      <mat-icon>delete</mat-icon>
      Xóa
    </button>
  </mat-dialog-actions>
</div>

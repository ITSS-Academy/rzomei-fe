<h2 mat-dialog-title>Nhập tên CV</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Tên CV</mat-label>
    <input matInput />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Hủy</button>
  <button
    mat-flat-button
    color="primary"
    [mat-dialog-close]="cvName"
    [disabled]="!cvName"
  >
    Lưu
  </button>
</mat-dialog-actions>
